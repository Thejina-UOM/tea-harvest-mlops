[project]
name = "tea-harvest-mlops"
version = "1.0.0"
description = "Explainable tea harvest-readiness prediction for Sri Lankan tea regions, with an end-to-end MLOps pipeline"
authors = [{ name = "Thejina" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Serving dependencies only: this is all the Docker image for the API installs.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn==1.9.1",        # pinned: the saved model must be loaded with the same version
    "interpret-core==0.7.8",      # pinned for the same reason (Explainable Boosting Machine)
    "joblib>=1.4",
    "pyyaml>=6.0",
    "azure-monitor-opentelemetry>=1.6",
]

[dependency-groups]
# Everything for training, tracking, testing, monitoring and the Streamlit app.
dev = [
    "mlflow>=3.0",
    "dvc>=3.50",
    "dvc-http>=2.32",
    "pandera>=0.20",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "shap>=0.46",
    "lime>=0.2.0.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.13",
    "evidently>=0.7.10",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "azure-identity>=1.17",
    "azure-monitor-query>=1.4",
    "streamlit>=1.40",
    "plotly>=5.24",
    "requests>=2.32",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# long user-facing copy and CSS strings in the Streamlit app
"frontend/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
