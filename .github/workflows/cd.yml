name: CD

# On every push to main: build the API and front-end images with the committed model,
# deploy the API to Azure as a canary after approval, update the front end, then mark
# that model version as @champion.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Never run two deployments at the same time: they would fight over the traffic split.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  DAGSHUB_REPO: ${{ vars.DAGSHUB_REPO || 'tea-harvest-mlops' }}
  APP_NAME: ca-tea-harvest
  FRONTEND_NAME: ca-tea-frontend
  RESOURCE_GROUP: rg-tea-mlops

jobs:
  build:
    if: vars.DAGSHUB_OWNER != ''
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.7"

      - name: Pull the exact model CI tested
        run: |
          uv sync --frozen
          make dvc-auth
          uv run dvc pull models/model.joblib

      - name: Image names (registries need lowercase)
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and push both images to GitHub Container Registry
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --build-arg MODEL_VERSION="$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          docker build -f Dockerfile.frontend -t "$IMAGE-frontend:$TAG" -t "$IMAGE-frontend:latest" .
          docker push "$IMAGE-frontend:$TAG"
          docker push "$IMAGE-frontend:latest"

  deploy:
    needs: build
    if: vars.AZURE_CLIENT_ID != ''   # skip until the Azure resources exist
    runs-on: ubuntu-24.04
    environment: production          # waits for a reviewer to approve
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Log in to Azure without a password (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pin all traffic to the revision that is live now
        run: |
          OLD=$(az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv)
          if [ -z "$OLD" ]; then
            OLD=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
              --query properties.latestRevisionName -o tsv)
          fi
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "$OLD=100" -o none
          echo "Live revision: $OLD"

      - name: Start the new revision (it receives 0% of traffic)
        run: |
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "$IMAGE:$TAG" --revision-suffix "$TAG" -o none
          echo "NEW=$APP_NAME--$TAG" >> "$GITHUB_ENV"

      - name: Smoke test the new revision on its own URL
        run: |
          FQDN=$(az containerapp revision show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision "$NEW" --query properties.fqdn -o tsv)
          for attempt in $(seq 1 30); do
            if curl -sf "https://$FQDN/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::The new revision never became healthy. Users still see $OLD."
          exit 1

      - name: Canary - 10% of traffic to the new revision
        run: |
          az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "$OLD=90" "$NEW=10" -o none
          sleep 120   # in a real team, check error rates in Application Insights here

      - name: Release - 100% of traffic to the new revision
        run: |
          az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "$NEW=100" -o none
          echo "Rollback, if ever needed: az containerapp ingress traffic set -n $APP_NAME \
            -g $RESOURCE_GROUP --revision-weight $OLD=100" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the Streamlit front end
        run: |
          if az containerapp show -n "$FRONTEND_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            az containerapp update -n "$FRONTEND_NAME" -g "$RESOURCE_GROUP" \
              --image "$IMAGE-frontend:$TAG" -o none
            URL=$(az containerapp show -n "$FRONTEND_NAME" -g "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "Front end: https://$URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No front-end container app found; skipping."
          fi

  promote:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.7"

      - name: Mark the deployed model as @champion
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
        run: |
          uv sync --frozen
          uv run python -m src.registry promote --image "$IMAGE"
